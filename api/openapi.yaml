openapi: 3.0.0
info:
  title: EtherHeirloom Smart Contract API
  description: |
    This is a machine-readable specification for interacting with the EtherHeirloom smart contract.
    Since the protocol is decentralized, "API calls" are translated into Ethereum JSON-RPC requests 
    targeted at the contract address.
  version: 1.0.0
servers:
  - url: https://ether-heirloom.github.io/
paths:
  /setupLegacies:
    post:
      summary: Establish an inheritance plan
      description: Sets heirs, their shares (basis points, total 10000) and the date (now + delaySeconds) after which the plan can be executed. Payable with setupFee().
      operationId: setupLegacies
      responses:
        '200':
          description: Successful transaction broadcast
  /resetDeadline:
    post:
      summary: Move the plan date
      description: Sets the date to now + newDelaySeconds (later or earlier). Heirs and shares are unchanged. Payable with deadlineExtensionFee(). There are no proof-of-life check-ins.
      operationId: resetDeadline
      responses:
        '200':
          description: Successful transaction broadcast
  /claimLegacies:
    post:
      summary: Claim inherited assets
      description: After the owner's date, anyone may call it. Transfers the beneficiary's due share of each token from the owner to the beneficiary stored in the plan. Payable with operationFee() per transaction (up to 10 tokens).
      operationId: claimLegacies
      responses:
        '200':
          description: Successful transaction broadcast
